<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional İnteraktiv Hava Proqnozu</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="preload" href="./data/weather-codes.json" as="fetch" type="application/json" crossorigin>

    <link rel="stylesheet" href="./assets/css/style.css">
    <script type="module" src="./assets/js/app.js"></script>
    <script type="module" src="./assets/js/ui.js"></script>

</head>

<body>
    <canvas id="weather-canvas"></canvas>
    <div class="app-container">

       <div class="map-section">
            <div class="search-box-container">
                <input type="text" id="city-input" placeholder="Məkan adı daxil edin">
                <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            
            <!-- Xəritə və ipucu yazısını saxlayan konteyner -->
           <div class="map-wrapper" style="position: relative; width: 100%; height: 100%;">
    <div id="map" style="width: 100%; height: 100%;"></div>

    <div id="map-hint" class="map-hint">
        <i class="fa-solid fa-hand-pointer"></i> Xəritədən istədiyiniz məkanı seçin
    </div>
</div>
        </div>

        <div class="weather-section">
            <div class="header">
                <h2 id="location-header" style="display: none;">
                    <i id="location-icon" class="fa-solid fa-location-dot"></i>
                    <span id="location-title"></span>
                </h2>
                <p id="location-date-time">--</p>
            </div>

            <div class="current-weather">
                <div class="temp-box">
                    <h1 id="current-temp">--°C</h1>
                    <p id="weather-desc">Buludlu</p>
                </div>
                <div class="weather-icon">
                    <img id="main-icon" src="" alt="Hava İkonu" style="width: 75px; height: 75px;">
                </div>
            </div>

            <div class="weather-details">
                <div class="detail-item">
                    <object id="wind-icon" data="https://cdn.meteocons.com/3.0.0-next.10/svg/fill/wind.svg"
                        type="image/svg+xml" style="width: 35px; height: 35px;"></object> <span>Külək</span>
                    <strong id="wind-speed">-- km/s</strong>
                </div>
                <div class="detail-item">
                    <object id="humidity-icon" data="https://cdn.meteocons.com/3.0.0-next.10/svg/fill/raindrop.svg"
                        type="image/svg+xml" style="width: 35px; height: 35px;"></object> <span>Rütubət</span>
                    <strong id="humidity">--%</strong>
                </div>
            </div>

            <h3><i class="fa-solid fa-calendar-days"></i> 7 Günlük Proqnoz</h3>

            <div class="weekly-forecast" id="weekly-container">
                <p class="placeholder-text">Zəhmət olmasa xəritədən nöqtə seçin və ya axtarış edin.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>

</html>
